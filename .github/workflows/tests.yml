name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The trackers, camera-motion maths and metrics need no GPU and no data:
      # every test runs on synthetic scenes with known answers.
      - run: pip install -r requirements.txt
      - run: python -m pytest -q -rs
